# =========================================================
# BASIC CONVERSATION INTENTS
# =========================================================

- intent: greet
  examples: |
    - hello
    - hi
    - hey
    - hey there
    - good morning
    - good afternoon
    - good evening
    - hi fitness assistant
    - hello gym assistant
    - what's up

- intent: goodbye
  examples: |
    - goodbye
    - bye
    - see you
    - see you later
    - talk to you later
    - I am done
    - thanks bye
    - catch you later

- intent: affirm
  examples: |
    - yes
    - yeah
    - correct
    - sure
    - definitely
    - of course
    - sounds good
    - okay
    - that is right

- intent: deny
  examples: |
    - no
    - nope
    - not really
    - I do not want that
    - that is incorrect
    - no thanks
    - something else
    - not that one

- intent: mood_great
  examples: |
    - I am feeling great
    - I feel good
    - I am happy
    - I feel amazing
    - everything is going well
    - I am ready to exercise

- intent: mood_unhappy
  examples: |
    - I am feeling sad
    - I feel bad
    - I am unhappy
    - I had a bad day
    - I do not feel great
    - I have no motivation

- intent: bot_challenge
  examples: |
    - are you a bot
    - are you human
    - who are you
    - am I talking to a bot
    - what are you
    - are you an AI

